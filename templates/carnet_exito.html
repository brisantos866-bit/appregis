<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro exitoso — Tu carnet digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width:640px;">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="bi bi-check-circle-fill text-success" style="font-size:3rem;"></i>
            <h2 class="fw-bold mt-3 mb-2">¡Registro completado!</h2>
            <p class="text-muted">Tu carnet digital ya está listo. Guárdalo o compártelo.</p>

            <img src="{{ url_for('carnet_qr', token=r['token']) }}"
                 alt="QR de tu carnet"
                 style="width:180px; border:1px solid #dee2e6; border-radius:12px; padding:8px; margin:20px auto; display:block;">

            <div class="d-grid gap-2">
                <a href="{{ url_for('ver_carnet', token=r['token']) }}"
                   class="btn btn-primary btn-lg fw-bold">
                    <i class="bi bi-person-vcard me-1"></i> Ver mi carnet digital
                </a>
                <a href="{{ url_for('carnet_qr', token=r['token']) }}" download="qr-carnet.png"
                   class="btn btn-outline-secondary">
                    <i class="bi bi-download me-1"></i> Descargar QR
                </a>
            </div>
<a href="{{ url_for('registro') }}" class="btn btn-link text-muted">
    <i class="bi bi-arrow-left"></i> Volver al inicio
</a>
<a href="{{ url_for('registro') }}" class="btn btn-outline-primary">
    <i class="bi bi-house-door me-1"></i> Ir a la página principal
</a>
            <hr class="my-4">
            <small class="text-muted d-block mb-1">Link directo a tu carnet (guárdalo):</small>
            <code class="d-block p-2 bg-light rounded" style="word-break:break-all;">{{ url_carnet }}</code>
        </div>
    </div>
</div>
</body>
</html>
