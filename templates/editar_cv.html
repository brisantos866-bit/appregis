<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Currículum Vitae</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { max-width: 800px; margin: 40px auto; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card p-4">
            <h2 class="text-center text-primary mb-4">Editar Mi Currículum Vitae</h2>
            
            <!-- Mensajes flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('editar_cv', token=r.token) }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">Profesión u Ocupación</label>
                    <input type="text" class="form-control" name="profesion" value="{{ r.profesion or '' }}" placeholder="Ej. Ingeniero en Sistemas, Estudiante, etc.">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Perfil Profesional</label>
                    <textarea class="form-control" name="perfil" rows="3" placeholder="Escribe un breve resumen sobre ti...">{{ r.perfil or '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Experiencia Laboral</label>
                    <textarea class="form-control" name="experiencia" rows="4" placeholder="Escribe tu experiencia (puedes usar guiones para hacer listas)...">{{ r.experiencia or '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Educación</label>
                    <textarea class="form-control" name="educacion" rows="3" placeholder="Tus estudios, títulos, etc.">{{ r.educacion or '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Habilidades</label>
                    <textarea class="form-control" name="habilidades" rows="3" placeholder="Ej. Programación, trabajo en equipo, idiomas...">{{ r.habilidades or '' }}</textarea>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">💾 Guardar Currículum</button>
                    <a href="{{ url_for('ver_cv', token=r.token) }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
